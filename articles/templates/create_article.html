{% extends "base.html" %}

{% block title %}Создание статьи{% endblock %}

{% block content %}

<section class="editor-layout">

    <div class="editor-card">

        <p class="eyebrow">New story</p>

        <h1 class="editor-card__title">
            Создать статью
        </h1>

        <p class="editor-card__intro">
            Сначала материал сохранится как черновик. После этого его можно отправить на модерацию.
        </p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                Сохранить черновик
            </button>
        </form>

        <div class="editor-back">
            <a href="{% url 'my_articles' %}">
                ← Назад к моим статьям
            </a>
        </div>

    </div>

</section>

{% endblock %}
