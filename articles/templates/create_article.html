{% extends "base.html" %}

{% block title %}Создание статьи{% endblock %}

{% block content %}

<h1>Создать статью</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Сохранить черновик
    </button>
</form>

<p>
    <a href="{% url 'my_articles' %}">
        Назад к моим статьям
    </a>
</p>

{% endblock %}
