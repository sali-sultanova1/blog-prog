{% extends "base.html" %}

{% block title %}Редактирование статьи{% endblock %}

{% block content %}

<section class="editor-layout">

    <div class="editor-card">

        <p class="eyebrow">Edit story</p>

        <h1 class="editor-card__title">
            Редактировать статью
        </h1>

        <p class="editor-card__intro">
            {{ article.title }}
        </p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% include "includes/form_fields.html" %}

            <button type="submit">
                Сохранить изменения
            </button>
        </form>

        <div class="editor-back">
            <a href="{% url 'my_articles' %}">
                ← Назад к моим статьям
            </a>
        </div>

    </div>

</section>

{% endblock %}
