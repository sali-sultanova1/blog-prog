{% extends "base.html" %}

{% block title %}Редактирование статьи{% endblock %}

{% block content %}

<h1>Редактировать статью</h1>

<p>
    Статья:
    <strong>{{ article.title }}</strong>
</p>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Сохранить изменения
    </button>
</form>

<p>
    <a href="{% url 'my_articles' %}">
        Назад к моим статьям
    </a>
</p>

{% endblock %}
