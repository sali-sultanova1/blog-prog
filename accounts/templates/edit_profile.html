{% extends "base.html" %}

{% block title %}Редактирование профиля{% endblock %}

{% block content %}

<section class="editor-layout">

    <div class="editor-card">

        <p class="eyebrow">Profile settings</p>

        <h1 class="editor-card__title">
            Редактировать профиль
        </h1>

        <p class="editor-card__intro">
            Обновите имя, биографию, email или фотографию профиля.
        </p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                Сохранить изменения
            </button>
        </form>

        <div class="editor-back">
            <a href="{% url 'profile' %}">
                ← Назад к профилю
            </a>
        </div>

    </div>

</section>

{% endblock %}
