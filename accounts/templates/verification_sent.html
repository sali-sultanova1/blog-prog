{% extends "base.html" %}

{% block title %}Подтвердите email{% endblock %}

{% block content %}

<section class="editor-layout">
    <div class="editor-card">

        <p class="eyebrow">Email verification</p>

        <h1 class="editor-card__title">
            Проверьте почту
        </h1>

        <p class="editor-card__intro">
            Мы отправили ссылку для подтверждения на {{ email }}.
            Перейдите по ней, чтобы завершить регистрацию.
            Ссылка действительна 30 минут.
        </p>

        <div class="editor-back">
            <a href="{% url 'login' %}">
                Перейти ко входу
            </a>
        </div>

    </div>
</section>

{% endblock %}
