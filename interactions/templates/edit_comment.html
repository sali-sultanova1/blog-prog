{% extends "base.html" %}

{% block title %}Редактирование комментария{% endblock %}

{% block content %}

<h1>Редактировать комментарий</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Сохранить изменения
    </button>
</form>

<p>
    <a href="{% url 'article_detail' comment.article.slug %}">
        Назад к статье
    </a>
</p>

{% endblock %}
