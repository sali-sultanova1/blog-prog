{% extends "base.html" %}

{% block title %}Редактирование комментария{% endblock %}

{% block content %}

<section class="editor-layout">

    <div class="editor-card">

        <p class="eyebrow">Comment</p>

        <h1 class="editor-card__title">
            Редактировать комментарий
        </h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                Сохранить изменения
            </button>
        </form>

        <div class="editor-back">
            <a href="{% url 'article_detail' comment.article.slug %}">
                ← Назад к статье
            </a>
        </div>

    </div>

</section>

{% endblock %}
